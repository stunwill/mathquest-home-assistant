name: Sync v0.35 frontend lockfile

on:
  push:
    branches:
      - release/v0.35.0-ha-parent-integration

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.35.0-ha-parent-integration
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile from package manifest
        working-directory: questmath/app/frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- questmath/app/frontend/package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add questmath/app/frontend/package-lock.json
          git commit -m "Synchronise frontend lockfile for v0.35.0"
          git push origin HEAD:release/v0.35.0-ha-parent-integration
