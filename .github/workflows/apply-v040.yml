name: Apply MathQuest v0.4.0 source changes

on:
  push:
    branches:
      - feature/v0.4.0-learning-area-selection
    paths:
      - tools/apply_v040.py
      - .github/workflows/apply-v040.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.4.0-learning-area-selection
      - name: Apply source migration
        run: python tools/apply_v040.py
      - name: Validate generated source
        run: |
          python -m compileall -q questmath/app/backend/app
          cd questmath/app/frontend
          npm install
          npm run build
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add questmath
          git rm tools/apply_v040.py .github/workflows/apply-v040.yml
          git commit -m "feat: add learning-area selection for v0.4.0"
          git push origin feature/v0.4.0-learning-area-selection
