name: Validate MathQuest

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r questmath/app/backend/requirements.txt pytest httpx==0.28.1 pyyaml==6.0.3
      - name: Compile backend
        run: python -m compileall -q questmath/app/backend/app
      - name: Run backend tests
        env:
          QUESTMATH_DATA_DIR: /tmp/mathquest-test-data
        run: PYTHONPATH=questmath/app/backend pytest -q questmath/app/backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: questmath/app/frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: questmath/app/frontend
        run: npm test
      - name: Build frontend
        working-directory: questmath/app/frontend
        run: npm run build

  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate whitespace and diff
        shell: bash
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git show --check --oneline HEAD
          fi
      - name: Install metadata validation dependencies
        run: pip install -r questmath/app/backend/requirements.txt pyyaml==6.0.3
      - name: Validate YAML
        run: |
          python - <<'PY'
          import pathlib
          import yaml
          for path in [
              pathlib.Path('repository.yaml'),
              pathlib.Path('questmath/config.yaml'),
              pathlib.Path('questmath/build.yaml'),
              pathlib.Path('.github/workflows/validate.yml'),
              pathlib.Path('.github/workflows/release.yml'),
          ]:
              with path.open() as handle:
                  yaml.safe_load(handle)
              print(f'validated {path}')
          PY
      - name: Validate version and DevHub metadata consistency
        run: python scripts/validate_versions.py
      - name: Validate runtime health version source
        run: |
          PYTHONPATH=questmath/app/backend QUESTMATH_DATA_DIR=/tmp/mathquest-metadata-health python - <<'PY'
          import yaml
          from app import v0351

          with open('questmath/config.yaml', encoding='utf-8') as handle:
              expected = str(yaml.safe_load(handle)['version'])
          health_route = next(
              route for route in v0351.app.routes
              if getattr(route, 'path', None) == '/api/health' and 'GET' in getattr(route, 'methods', set())
          )
          actual = str(health_route.endpoint()['version'])
          if actual != expected:
              raise SystemExit(f'/api/health version mismatch: expected {expected}, got {actual}')
          print(f'/api/health reports expected version {actual}')
          PY
      - name: Validate release-note extraction
        run: |
          VERSION="$(python - <<'PY'
          import yaml
          from pathlib import Path

          config = yaml.safe_load(Path('questmath/config.yaml').read_text(encoding='utf-8'))
          print(config['version'])
          PY
          )"
          python scripts/extract_release_notes.py "$VERSION" --output /tmp/release-notes.md

  addon-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable arm64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build aarch64 add-on image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --load \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/aarch64-base:3.21 \
            --tag mathquest:aarch64-smoke \
            questmath
      - name: Start aarch64 add-on and verify health
        shell: bash
        run: |
          set -euo pipefail
          docker network create mathquest-smoke
          docker run -d --name supervisor \
            --network mathquest-smoke \
            --network-alias supervisor \
            python:3.12-alpine \
            python -c 'from http.server import BaseHTTPRequestHandler,HTTPServer; import json; options={"parent_username":"parent","parent_password":"SmokeParent123!","student_username":"student","student_password":"SmokeStudent123!","student_display_name":"Math Explorer","timezone":"Australia/Melbourne"}; payload=json.dumps({"result":"ok","data":{**options,"options":options}}).encode(); Handler=type("Handler",(BaseHTTPRequestHandler,),{"do_GET":lambda self:(self.send_response(200),self.send_header("Content-Type","application/json"),self.end_headers(),self.wfile.write(payload)),"log_message":lambda *args:None}); HTTPServer(("0.0.0.0",80),Handler).serve_forever()'
          docker run -d --name mathquest-aarch64-smoke \
            --platform linux/arm64 \
            --network mathquest-smoke \
            -p 18080:8080 \
            mathquest:aarch64-smoke
          trap 'docker logs mathquest-aarch64-smoke || true; docker rm -f mathquest-aarch64-smoke supervisor || true; docker network rm mathquest-smoke || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/api/health > /tmp/mathquest-health.json; then
              cat /tmp/mathquest-health.json
              python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('/tmp/mathquest-health.json').read_text())
          if payload.get('version') != '0.35.1':
              raise SystemExit(f"unexpected health version: {payload}")
          PY
              exit 0
            fi
            sleep 2
          done
          echo 'MathQuest aarch64 startup health check failed'
          exit 1
