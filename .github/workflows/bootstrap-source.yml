name: Bootstrap MathQuest source

on:
  push:
    branches:
      - setup/initial-mathquest-repository
    paths:
      - .bootstrap/READY

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: setup/initial-mathquest-repository
      - name: Restore source archive
        run: |
          cat .bootstrap/part* > /tmp/mathquest-src.b64
          base64 --decode /tmp/mathquest-src.b64 > /tmp/mathquest-src.tgz
          tar -xzf /tmp/mathquest-src.tgz
          rm -rf .bootstrap
      - name: Commit restored source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add questmath .bootstrap
          git commit -m "feat: add MathQuest 0.3.1 source"
          git push origin setup/initial-mathquest-repository
